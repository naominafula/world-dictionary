<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordbook – World Dictionary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Wordbook</h1>
    <p class="tagline">Look up any word in 10+ languages.</p>

    <div class="search" role="search">
      <input id="q" type="search" placeholder="Type a word…" aria-label="Word to look up" autocomplete="off" autofocus>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt-BR">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="hi">Hindi</option>
        <option value="ar">Arabic</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="tr">Turkish</option>
      </select>
      <button class="go" id="go">Search</button>
    </div>

    <div id="history" aria-label="Recent searches"></div>
    <div id="result" aria-live="polite">
      <p class="msg">Type a word and press Search to see its meaning.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
